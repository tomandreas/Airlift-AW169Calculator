:root{
  --bg:#0b0e14; --surface:#121722; --surface2:#171e2b; --line:#232d3f; --text:#e4e8ef; --dim:#8791a3; --faint:#566074;
  --amber:#e8a020; --blue:#4ea8de; --good:#5cc98a; --bad:#e5604f;
  --display:'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.5;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:32px 32px;
}
button{ background:var(--surface2); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:7px 10px; font:inherit; font-size:12px; cursor:pointer; }
button:hover{ border-color:var(--amber); }
button.on{ background:var(--amber); color:#14100a; border-color:var(--amber); }
.msg{ color:var(--bad); font-size:11px; min-height:1em; margin-top:4px; }
/* iOS widgets */
.w{ position:relative; border-radius:22px; overflow:hidden; color:var(--text);
  background:linear-gradient(165deg,#161d2a 0%,#0d121b 100%); box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 0 .5px rgba(255,255,255,.06); }
.w .loc{ font-family:var(--display); font-size:19px; line-height:1; letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  padding-top:.2em; margin-top:-.2em; }
.w .sub{ font-size:10px; color:var(--dim); }
.w .big{ font-family:var(--display); font-size:36px; line-height:.9; }
.w .t{ font-size:15px; font-weight:500; letter-spacing:-.01em; }
.w .t sup{ font-size:8px; color:var(--amber); margin-left:1px; }
.w .t2{ font-size:10px; color:var(--dim); }
.w .k{ font-size:9.5px; color:var(--dim); }
.w .note{ font-size:11px; color:var(--dim); line-height:1.2; }
.times4{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
.times2{ display:grid; grid-template-columns:repeat(2,1fr); gap:4px 12px; }
.w .times2 .t, .a-sec .times2 .t{ color:var(--amber); font-size:20px; }
.times4 .t{ color:var(--text); }
.times4 > div:nth-child(2) .t, .times4 > div:nth-child(3) .t{ color:var(--amber); }
canvas.moon{ display:block; }
.moonrow{ display:flex; gap:14px; align-items:center; }
.mgrid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; flex:1; }
.mgrid .t{ font-size:13px; }
.blue{ color:var(--blue); }
.amber{ color:var(--amber); }
.wl-note{ white-space:nowrap; font-size:calc(var(--wm,344px) / 38); }
.tools-back{ display:inline-block; margin:6px 18px 0; padding:10px 4px 6px 0; font-family:"LN Mono","IBM Plex Mono",monospace; font-size:11px; letter-spacing:1px; color:var(--dim); text-decoration:none; }
.tools-back:hover, .tools-back:focus-visible{ color:var(--amber); }
.a-nav{ display:flex; justify-content:space-between; align-items:flex-start; padding:8px 18px 4px; gap:10px; }
.a-locbtn{ background:none; border:none; padding:0; text-align:left; color:var(--text); min-width:0; cursor:pointer; }
.a-locname{ font-family:var(--display); font-size:30px; line-height:1; letter-spacing:.02em; padding-top:.18em; display:inline-block; max-width:290px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
.a-chev{ color:var(--amber); font-size:14px; margin-left:6px; }
.a-locsub{ display:block; color:var(--dim); font-size:11px; margin-top:2px; }
.a-icon{ background:var(--surface2); border:1px solid var(--line); border-radius:50%; width:38px; height:38px; padding:0; display:grid; place-items:center; color:var(--text); cursor:pointer; flex-shrink:0; margin-top:6px; }
.a-date{ display:flex; align-items:center; justify-content:space-between; padding:8px 12px 2px; }
.a-date > button{ background:none; border:none; color:var(--amber); font-size:24px; width:40px; height:36px; cursor:pointer; padding:0; }
.a-date .d{ font-size:13px; display:flex; align-items:center; gap:8px; }
.a-pill{ background:var(--surface2)!important; border:1px solid var(--line)!important; border-radius:12px!important; padding:2px 9px!important; font-size:11px!important; color:var(--amber)!important; }
.a-graph{ position:relative; margin:6px 0 0; cursor:ew-resize; touch-action:none; user-select:none; }
.a-graph svg{ display:block; }
.a-scrub{ position:absolute; left:16px; top:6px; display:flex; align-items:baseline; gap:6px; pointer-events:none; }
.a-scrub .a-time{ font-family:var(--display); font-size:30px; line-height:1; color:var(--amber); padding-top:.1em; text-shadow:0 1px 8px #0008; }
.a-scrub span:not(.a-time){ font-size:10px; color:var(--dim); }
.a-now{ position:absolute; right:14px; top:8px; background:var(--amber)!important; color:#14100a!important; border:none!important; border-radius:12px!important; padding:3px 11px!important; font-size:11px!important; font-weight:600; cursor:pointer; }
.a-hint{ color:var(--faint); font-size:10px; text-align:center; margin:6px 0 2px; }
.a-sec{ padding:12px 18px 4px; }
.a-sec .t{ font-size:17px; }
.a-subh{ color:var(--dim); font-size:11px; margin-bottom:6px; }
.a-tw{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px 10px; align-items:baseline; }
.a-tw .h{ color:var(--faint); font-size:10px; }
.a-tw .lbl{ color:var(--dim); font-size:11px; }
.a-tw b{ font-weight:500; font-size:15px; }
.a-tw .none{ grid-column:2/4; color:var(--dim); font-size:12px; }
.a-card{ margin:14px 12px 0; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; }
.a-card .mgrid .t{ font-size:14px; }
.a-links{ margin:14px 12px 0; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.a-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; background:none; border:none; border-bottom:1px solid rgba(255,255,255,.06);
  color:var(--text); padding:13px 14px; font-size:13px; text-align:left; cursor:pointer; min-height:46px; }
.a-row:last-child{ border-bottom:none; }
.a-row .a-val{ color:var(--dim); font-size:12px; text-align:right; }
.a-row .a-val .ch{ color:var(--faint); margin-left:6px; }
.a-row.static{ cursor:default; }
.a-bar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:6px 12px; min-height:44px; }
.a-back{ background:none; border:none; color:var(--amber); font-size:14px; padding:4px 2px; cursor:pointer; justify-self:start; }
.a-title{ font-family:var(--display); font-size:22px; letter-spacing:.03em; padding-top:.15em; }
.a-right{ justify-self:end; }
.a-right button{ background:none; border:none; color:var(--amber); font-size:13px; cursor:pointer; }
.a-bigtitle{ font-family:var(--display); font-size:38px; line-height:1; padding:6px 18px 2px; padding-top:.2em; }
.a-lede{ color:var(--dim); font-size:11px; padding:0 18px 8px; }
.a-grp-t{ color:var(--dim); font-size:11px; padding:18px 26px 6px; }
.a-grp{ margin:0 12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.a-foot{ color:var(--faint); font-size:10.5px; padding:10px 26px 0; line-height:1.45; }
.a-sw{ appearance:none; -webkit-appearance:none; width:46px; height:28px; border-radius:14px; background:#2a3242; position:relative; cursor:pointer; flex-shrink:0; margin:0; padding:0; border:none; }
.a-sw::after{ content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s; }
.a-sw:checked{ background:var(--amber); }
.a-sw:checked::after{ left:21px; }
.a-search{ padding:4px 12px 8px; }
.a-search input{ border-radius:10px; padding:9px 12px; font-size:13px; background:var(--surface); }
.a-lrow{ padding:0; }
.a-lmain{ flex:1; background:none; border:none; color:var(--text); text-align:left; padding:11px 14px; cursor:pointer; min-width:0; }
.a-lmain b{ display:block; font-weight:500; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.a-lmain span{ display:block; color:var(--dim); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.a-lright{ padding-right:14px; text-align:right; font-size:12px; color:var(--dim); flex-shrink:0; }
.a-lright b{ display:block; color:var(--text); font-weight:500; font-size:14px; }
.a-add, .a-del{ width:30px; height:30px; border-radius:50%; margin-right:12px; flex-shrink:0; cursor:pointer; font-size:17px; line-height:1; padding:0; }
.a-add{ background:var(--surface2); border:1px solid var(--line); color:var(--amber); }
.a-del{ background:#b23a2e; border:none; color:#fff; margin:0 0 0 12px; }
.a-sel{ color:var(--amber); }
.a-msg{ color:var(--bad); font-size:11px; padding:6px 26px 0; }
/* map */
.a-map{ position:relative; height:calc(var(--ph,874px) - var(--pt,62px) - 44px - 150px); background:#0a0e16; overflow:hidden; touch-action:none; cursor:grab; }
.a-map canvas{ display:block; }
.a-pin{ position:absolute; left:50%; top:50%; transform:translate(-50%,-100%); pointer-events:none; }
.a-zoom{ position:absolute; right:12px; top:12px; display:flex; flex-direction:column; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
.a-zoom button{ width:40px; height:40px; background:var(--surface2); border:none; color:var(--text); font-size:20px; cursor:pointer; padding:0; }
.a-zoom button + button{ border-top:1px solid var(--line); }
.a-mapnote{ position:absolute; left:12px; bottom:10px; font-size:10px; color:var(--faint); background:#0a0e16cc; padding:2px 6px; border-radius:4px; }
.a-sheet{ padding:14px 18px; }
.a-mname{ font-family:var(--display); font-size:26px; line-height:1; padding-top:.15em; }
.a-mco{ color:var(--dim); font-size:11px; margin:4px 0 12px; }
.a-mbtns{ display:flex; gap:10px; }
.a-mbtns button{ flex:1; padding:11px; border-radius:12px; font-size:13px; }
/* outlook */
.a-legend{ display:flex; gap:14px; padding:0 18px 10px; font-size:10px; color:var(--dim); align-items:center; }
.a-legend i{ display:inline-block; width:18px; height:8px; border-radius:2px; margin-right:5px; vertical-align:middle; }
.a-night{ display:grid; grid-template-columns:52px 40px 1fr 50px; gap:8px; align-items:center; width:100%; background:none; border:none; border-bottom:1px solid rgba(255,255,255,.06); color:var(--text); padding:10px 14px; text-align:left; cursor:pointer; }
.a-night:last-child{ border-bottom:none; }
.a-night.cur{ background:rgba(232,160,32,.07); }
.a-nd{ line-height:1.05; }
.a-nd span{ display:block; color:var(--dim); font-size:10px; }
.a-nd b{ font-family:var(--display); font-weight:400; font-size:22px; padding-top:.1em; display:block; white-space:nowrap; }
.a-ng{ display:flex; flex-direction:column; align-items:center; font-size:10px; color:var(--dim); gap:2px; }
.a-nb svg{ display:block; width:100%; }
.a-nt{ display:flex; justify-content:space-between; font-size:10px; color:var(--dim); margin-top:3px; }
.a-nm{ text-align:right; line-height:1.1; }
.a-nm b{ display:block; font-size:15px; font-weight:500; }
.a-nm span{ font-size:9.5px; color:var(--dim); }
.a-nx{ grid-column:3/5; color:var(--dim); font-size:11px; }
/* calendar */
.a-calhead{ display:flex; justify-content:space-between; align-items:center; padding:4px 12px 8px; }
.a-calhead button{ background:none; border:none; color:var(--amber); font-size:24px; width:40px; height:36px; cursor:pointer; }
.a-calhead .m{ font-family:var(--display); font-size:28px; padding-top:.15em; }
.a-cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:0 10px; }
.a-cal .dow{ text-align:center; color:var(--faint); font-size:10px; padding-bottom:4px; }
.a-cell{ background:var(--surface); border:1px solid transparent; border-radius:10px; padding:6px 0 4px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color:var(--text); }
.a-cell span{ font-size:11px; }
.a-cell.today{ border-color:var(--amber); }
.a-cell.sel{ background:#1c2d42; }
.a-cell.q span{ color:var(--amber); }
.a-phases .a-row b{ font-weight:500; }
.a-secwrap{ margin-top:10px; }
.a-sech{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:56px; padding:10px 18px; background:var(--surface); color:var(--text); border:none; border-top:1px solid var(--line); border-bottom:1px solid var(--line); border-radius:0; text-align:left; cursor:pointer; }
.a-sech:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }
.a-sect{ display:block; font-family:var(--display); font-size:24px; letter-spacing:.03em; line-height:1; padding-top:.15em; }
.a-secsum{ display:block; margin-top:5px; font-size:11px; color:var(--dim); line-height:1.4; }
.a-secsum:empty{ display:none; }
.a-secsum b{ font-weight:500; color:var(--text); }
.a-secsum .dt{ color:var(--amber); border-radius:3px; }
.a-secwrap.open .a-secsum{ display:none; }
.a-chv{ color:var(--amber); font-size:22px; line-height:1; transition:transform .2s; flex-shrink:0; }
.a-secwrap.open .a-chv{ transform:rotate(90deg); }
.a-secb{ overflow:hidden; }
.a-secb[hidden]{ display:none; }
@keyframes a-flash{ from{ background:rgba(232,160,32,.4); } to{ background:rgba(232,160,32,0); } }
.a-secsum .dt.flash{ animation:a-flash .9s ease-out; }
@media (prefers-reduced-motion: reduce){ .a-secsum .dt.flash{ animation:none; } }
@media (prefers-reduced-motion: reduce){ *{ transition:none!important; } }
/* ---------- LOOME Night Ops: a real phone page ---------- */
:root{ padding:0 !important; --fullh:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); --display:'LN Display','Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif; --mono:'LN Mono','IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; background:var(--bg); scroll-padding-top:0; }
@supports (height:100dvh){ :root{ --fullh:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); } }
body{ padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); font-size:13px; overflow-x:hidden; }
#app.w{ position:relative; max-width:560px; margin:0 auto; background:none; box-shadow:none; border-radius:0; overflow:visible; min-height:var(--fullh); padding-bottom:40px; }
a{ color:var(--blue); }
input, select, textarea{ font:inherit; font-size:16px; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; width:100%; }
button:focus-visible, input:focus-visible, a:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
button{ font-family:var(--mono); }
.a-nav{ padding-top:10px; }
.a-locname{ max-width:calc(100vw - 110px); }
.a-foot a{ color:var(--blue); }
.a-graph{ touch-action:pan-y; cursor:ew-resize; }
.a-secwrap[data-sec="dash"] .a-secb{ touch-action:pan-y pinch-zoom; }
.a-map{ height:calc(var(--fullh) - 235px); min-height:300px; }
.a-mapnote{ max-width:calc(100% - 24px); }
/* first visit */
.a-start{ min-height:var(--fullh); display:flex; flex-direction:column; justify-content:center; gap:14px; padding:32px 22px; }
.a-brand{ font-family:var(--display); font-size:clamp(58px,19vw,92px); line-height:.88; letter-spacing:.01em; padding-top:.1em; }
.a-brand span{ display:block; color:var(--text); }
.a-brand b{ display:block; font-weight:400; color:var(--amber); font-size:.5em; letter-spacing:.07em; margin-top:.08em; }
.a-tag{ color:var(--dim); margin:0 0 8px; font-size:13px; max-width:34ch; }
.a-big{ display:flex; align-items:center; justify-content:center; width:100%; min-height:56px; background:var(--amber); color:#14100a; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; padding:0 16px; }
.a-big:disabled{ opacity:.65; cursor:default; }
.a-or{ text-align:center; color:var(--faint); font-size:11px; letter-spacing:.16em; }
.a-small{ color:var(--faint); font-size:11px; line-height:1.55; margin:6px 0 0; }
.a-start .a-search input{ border-radius:12px; padding:14px 14px; background:var(--surface); }
/* iOS Safari zooms the whole page into any text field below 16px when it is tapped, so no field may be smaller */
input, select, textarea, .a-search input{ font-size:16px !important; }

/* the producer credit at the bottom of Settings */
.a-prod{ text-align:center; padding:36px 20px 12px; }
.a-prod img{ display:block; margin:0 auto 16px; width:260px; max-width:72%; height:auto; }
.a-prod p{ margin:0; color:var(--dim); font-size:12px; letter-spacing:.06em; }
.a-prod b{ display:block; margin-top:6px; font-family:var(--display); font-weight:400; font-size:26px; letter-spacing:.06em; color:var(--text); padding-top:.12em; }

/* the small arrow beside the place name while it follows your position */
.a-follow{ color:var(--amber); margin-right:8px; vertical-align:.05em; flex-shrink:0; }
.a-follow.stale{ opacity:.4; }

/* v6: page structure, readable notes, recovery screen */
.sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
h1.a-title, h1.a-brand{ margin:0; font-weight:400; }
.a-foot, .a-small, .a-hint{ color:var(--dim); }
.a-big.ghost{ background:transparent; color:var(--text); border:1px solid var(--line); }

/* v1.7: the "This position" button under the header, shown only when a tap would help */
.a-herewrap{ display:flex; justify-content:flex-end; padding:2px 18px 0; }
.a-here{ display:inline-flex; align-items:center; gap:7px; height:28px; padding:0 12px; border-radius:14px; background:rgba(232,160,32,.08); border:1px solid rgba(232,160,32,.45); color:var(--amber); font-size:12px; font-weight:500; letter-spacing:.02em; cursor:pointer; white-space:nowrap; }
.a-here:disabled{ opacity:.7; cursor:default; }
.a-here.fail{ color:var(--bad); border-color:rgba(229,96,79,.5); background:rgba(229,96,79,.08); }
.a-here svg{ flex-shrink:0; }

</style>

  for (sum = first, i = 0; i < 30; ++i) {

    sum += 1 << bits[i];

const GEO = { ready:false };
const REGION = (()=>{ try{ return new Intl.DisplayNames(['en'],{type:'region'}); }catch(e){ return null; } })();
const country = cc => { try{ return (REGION && REGION.of(cc)) || cc; }catch(e){ return cc; } };
const norm = s => s.toLowerCase().replace(/ø/g,'o').replace(/æ/g,'ae').replace(/ß/g,'ss').replace(/ð/g,'d').replace(/þ/g,'th').replace(/ł/g,'l')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
async function loadGeo(){
  try{
    const d = JSON.parse(await gunzipText(GEO_B64));
    GEO.tzs = d.tzs;
    const T = d.towns.split('\n'), n = T.length;
    GEO.tName = new Array(n); GEO.tCC = new Array(n); GEO.tNorm = new Array(n);

function dashBody(){
  const P = tzOf(st.ptz), nowT = S.zonedTime(st.date, st.minute, st.loc.tz);
  const ev = app.ev = evOn(st.date), m = S.stateAt(nowT, st.loc);
  const today = S.localDateStr(new Date(), st.loc.tz) === st.date;
  const dl = new Intl.DateTimeFormat('en-GB',{timeZone:st.loc.tz,weekday:'short',day:'numeric',month:'short'}).format(nowT);
  const tw = (label, a, b, state, kind) => `<div class="lbl">${label}</div>` + (a || b ? `<b>${a ? tHTML(a,P) : '—'}</b><b>${b ? tHTML(b,P) : '—'}</b>` : `<div class="none">${twText(state, kind)}</div>`);
  const extra = app.set.naut || app.set.astro ? `<div class="a-sec"><div class="a-tw"><div class="h"></div><div class="h">Dawn</div><div class="h">Dusk</div>
      ${app.set.naut ? tw('Nautical', ev.nautDawn, ev.nautDusk, ev.nautState, 'nautical') : ''}${app.set.astro ? tw('Astronomical', ev.astroDawn, ev.astroDusk, ev.astroState, 'astronomical') : ''}</div></div>` : '';
  return `
    <div class="a-date"><button data-act="prev" aria-label="Previous day">‹</button><div class="d">${dl}${today ? '' : '<button class="a-pill" data-act="today">Today</button>'}</div><button data-act="next" aria-label="Next day">›</button></div>
    <div class="a-graph" id="agraph">${graphSVG(ev, nowT)}
      <div class="a-scrub"><span class="a-time">${S.fmt(nowT, P)}</span><span>${tzShort(P, nowT)}</span></div>${st.live ? '' : '<button class="a-now" data-act="now">Now</button>'}</div>
    <div class="a-hint">Drag across the graph to move through the day. Swipe for other days.</div>
    <div class="a-sec">${twRow(ev)}</div>
    ${extra}
    <div class="a-card"><div class="moonrow"><canvas class="moon" data-size="116"></canvas><div class="mgrid">
      <div style="grid-column:1/3"><div class="loc blue" style="font-size:22px">${m.phaseName}</div></div>
      <div><div class="k">Illuminated</div><div class="t">${(m.illum*100).toFixed(1)}%</div></div>
      <div><div class="k">Moonlight</div><div class="t"${mlxStyle(m)}>${moonLight(m)}</div>${!isDaylight(m) && m.moonAlt <= -0.8 ? '<div class="t2">Below horizon</div>' : ''}</div>
      <div><div class="k">Moonrise</div><div class="t">${ev.moonrise ? tHTML(ev.moonrise,P) : `<span class="note">${moonText(ev,'moonrise')}</span>`}</div></div>

function graphW(){ const r = $('app'); return clamp(Math.round(r ? r.clientWidth : 402), 280, 560); }
function graphSVG(ev, nowT){ const W = graphW(); return pathSVG(ev, nowT, W, Math.round(W * 140 / 402), true); }   // always the 402 × 140 proportions
function drawPhoneMoons(){
  const ph = $('app'); if(!ph) return;
  const cs = ph.querySelectorAll('canvas.moon'); if(!cs.length || !st.loc || !st.date) return;
  const m = S.stateAt(S.zonedTime(st.date, st.minute, st.loc.tz), st.loc);
  cs.forEach(c => renderMoon(c, +c.dataset.size, m));
}
function toggleSection(id){   // open or close one section in place; the state is remembered
  const open = !secOpen(id);
  app.set.sec = { ...(app.set.sec || {}), [id]: open }; saveState();
  const wrap = $('app').querySelector(`[data-sec="${id}"]`); if(!wrap) return renderApp();
  const body = wrap.querySelector('.a-secb'), head = wrap.querySelector('.a-sech'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  head.setAttribute('aria-expanded', open); wrap.classList.toggle('open', open); clearTimeout(body._t);
  const finish = () => { body.style.height = ''; body.style.transition = ''; if(!open){ body.hidden = true; body.innerHTML = ''; } };
  if(open){
    body.innerHTML = secBody(id); body.hidden = false; if(id === 'dash') drawPhoneMoons();
    if(still){ finish(); } else { const h = body.scrollHeight; body.style.height = '0px'; body.getBoundingClientRect(); body.style.transition = 'height .22s ease'; body.style.height = h + 'px'; body._t = setTimeout(finish, 260); }
  } else {
    wrap.querySelector('.a-secsum').innerHTML = secSummary(id);
    if(still){ finish(); } else { body.style.height = body.getBoundingClientRect().height + 'px'; body.getBoundingClientRect(); body.style.transition = 'height .2s ease'; body.style.height = '0px'; body._t = setTimeout(finish, 240); }
  }
}

function unwrapRing(r){   // keep longitudes continuous across the 180° line (Russia, Fiji)
  const out = []; let prev = null, off = 0;
  for(const [x, y] of r){ let nx = x + off;
    if(prev !== null){ while(nx - prev > 180){ off -= 360; nx -= 360; } while(nx - prev < -180){ off += 360; nx += 360; } }

}
function makePoly(cc, rings){

async function loadOutlines(){

    const fine = await gunzipJson(OUT_FINE);

function inRing(x, y, r){ let c = false; for(let i = 0, j = r.length - 1; i < r.length; j = i++){ const a = r[i], b = r[j]; if((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0])*(y - a[1])/(b[1] - a[1]) + a[0]) c = !c; } return c; }

    for(const k of [0, -360, 360]){ const x = lon + k; if(x < b[0] || x > b[2]) continue;

function polyPath(x, p, off, px, py){

function eachPoly(polys, view, fn){ for(const p of polys){ const b = p.bbox; if(b[3] < view.la0 || b[1] > view.la1) continue;

function drawMap(){
  const c = $('amap'); if(!c) return; const box = $('amapbox'), W = box.clientWidth, H = box.clientHeight, dpr = 2;

    const view = { la0:M.lat - H/2/sc, la1:M.lat + H/2/sc, lo0:M.lon - W/2/(cl*sc), lo1:M.lon + W/2/(cl*sc) };

  x.strokeStyle = 'rgba(255,255,255,.05)'; x.lineWidth = 1; x.fillStyle = '#3a4659'; x.font = '9px "LN Mono", "IBM Plex Mono", monospace';

  vis.sort((a,b) => GEO.tPop[b]-GEO.tPop[a]); const boxes = []; x.font = '10px "LN Mono", "IBM Plex Mono", monospace';
  for(const i of vis.slice(0,60)){ const X = px(GEO.tLon[i])+5, Y = py(GEO.tLat[i])+3, w = x.measureText(GEO.tName[i]).width;

function mapLoc(){ const M = app.map, n = nameFor(M.lat, M.lon); return { name:n.name, short:n.short, lat:+M.lat.toFixed(4), lon:+M.lon.toFixed(4), tz:n.tz, meta:n.meta }; }


// ----- outlook -----
function buildNight(d, e, n){   // the night that starts on the evening of date d: civil dusk (d) to civil dawn (d+1)
  let a = e.civilDusk, b = n.civilDawn, kind = 'normal';
  if(!a || !b){ if(e.civilState === 'no-civil-dark') return { d, kind:'light' };
    a = a || S.zonedTime(d, 720, st.loc.tz); b = b || S.zonedTime(S.addDays(d,1), 720, st.loc.tz); kind = 'dark'; }
  const samples = []; let max = 0, maxT = null;
  for(let t = a.getTime(); t <= b.getTime(); t += 10*60000){ const v = S.moonLuxQuick(new Date(t), st.loc); samples.push(v); if(v > max){ max = v; maxT = new Date(t); } }
  return { d, kind, a, b, samples, max, maxT, m:S.stateAt(new Date((a.getTime()+b.getTime())/2), st.loc) };
}
const nightCache = {};   // one entry per night, so stepping a day only computes one new night
function nightOn(d){ const k = `${st.loc.lat},${st.loc.lon},${d}`; return nightCache[k] || (nightCache[k] = buildNight(d, evOn(d), evOn(S.addDays(d, 1)))); }
const nightsFrom = start => Array.from({ length:14 }, (_, i) => nightOn(S.addDays(start, i)));

function outlookAnchor(){

}

  const segs = n.samples.map((v,i) => { if(v <= 0) return ''; const mm = v*1000, op = Math.max(.14, Math.min(1, (Math.log10(mm)+1)/3.6));
    return `<rect x="${(i/k*W).toFixed(1)}" y="0" width="${(W/k+.6).toFixed(1)}" height="${H}" fill="#4ea8de" opacity="${op.toFixed(2)}"/>`; }).join('');

}
function outlookBody(){
  const A = outlookAnchor(), start = A ? A.start : st.date, nights = nightsFrom(start), P = tzOf(st.ptz), curNight = A ? A.night : st.date;
  const rows = nights.map(n => {
    const d2 = S.addDays(n.d, 1), fmtU = (d, o) => new Intl.DateTimeFormat('en-GB', { timeZone:'UTC', ...o }).format(new Date(d + 'T12:00Z'));

    return `<button class="a-night${n.d === curNight ? ' cur' : ''}" data-act="goto" data-date="${n.d}"${peak} aria-label="Night ${day} ${mon}, peak ${mlxNum(n.max)} mlx"><div class="a-nd"><span>${wd}</span><b>${day}</b><span>${mon}</span></div>
      <div class="a-ng">${moonGlyph(24, n.m)}<span>${(n.m.illum*100).toFixed(0)}%</span></div>

// ----- calendar -----
const calCache = {};
function calendarBody(){
  if(!app.cal) app.cal = st.date.slice(0,7);
  const [y, mo] = app.cal.split('-').map(Number), P = tzOf(st.ptz), L = st.loc.tz;
  const first = new Date(Date.UTC(y, mo-1, 1)), days = new Date(Date.UTC(y, mo, 0)).getUTCDate(), lead = (first.getUTCDay() + 6) % 7;
  const key = `${app.cal},${st.loc.lat},${st.loc.lon}`;
  if(!calCache[key]){
    const cells = []; for(let d=1; d<=days; d++){ const ds = `${app.cal}-${String(d).padStart(2,'0')}`; cells.push({ ds, d, m:S.stateAt(S.zonedTime(ds, 22*60, L), st.loc) }); }
    const qs = S.quarters(S.zonedTime(`${app.cal}-01`, 0, L), S.zonedTime(S.addDays(`${app.cal}-${String(days).padStart(2,'0')}`,1), 0, L));
    calCache[key] = { cells, qs };
  }
  const { cells, qs } = calCache[key], qDays = new Set(qs.map(q => S.localDateStr(q.date, L)));
  const today = S.localDateStr(new Date(), L);
  const names = ['New moon','First quarter','Full moon','Last quarter'];
  const title = new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',month:'long',year:'numeric'}).format(first);
  return `<div class="a-calhead" style="padding-top:12px"><button data-act="cprev" aria-label="Previous month">‹</button><div class="m">${title}</div><button data-act="cnext" aria-label="Next month">›</button></div>
    <div class="a-cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="dow">${d}</div>`).join('')}${'<div></div>'.repeat(lead)}
    ${cells.map(c => `<button class="a-cell${c.ds === today ? ' today' : ''}${c.ds === st.date ? ' sel' : ''}${qDays.has(c.ds) ? ' q' : ''}" data-act="goto" data-date="${c.ds}" aria-label="${c.ds}, ${c.m.phaseName}">${moonGlyph(28, c.m)}<span>${c.d}</span></button>`).join('')}</div>
    <div class="a-grp-t">Principal phases, ${esc(st.loc.name)}</div>
    <div class="a-grp a-phases">${qs.map(q => `<div class="a-row static"><b>${names[q.quarter]}</b><span class="a-val">${new Intl.DateTimeFormat('en-GB',{timeZone:P,weekday:'short',day:'numeric',month:'short'}).format(q.date)} ${S.fmt(q.date,P)}</span></div>`).join('')}</div>
    <p class="a-foot">Moon drawn as seen at 22:00 local time. Tap a day to set the Dashboard to it.</p>`;
}


// ---------- drawing ----------
function showRecovery(err){

  root.innerHTML = `<div class="a-start"><h1 class="a-brand"><span>LOOME</span><b>NIGHT OPS</b></h1>
    <p class="a-tag">Something went wrong and this page could not be drawn.</p>
    <button class="a-big" data-act="reload">Try again</button>
    <button class="a-big ghost" data-act="resetall">Reset saved data and restart</button>
    <p class="a-small">Resetting clears the saved places and settings on this device only.${err ? '<br>' + esc(String(err).slice(0, 140)) : ''}</p></div>`;
  window.scrollTo(0, 0);
}
function renderApp(fresh){
  if(app.crashed) return;
  try{ renderAppInner(fresh); }catch(e){ app.crashed = true; showRecovery(e && e.message); }
}
function renderAppInner(fresh){
  const root = $('app'); if(!root) return;
  const a = document.activeElement; if(!fresh && a && a.dataset && a.dataset.keep && root.contains(a)) return;   // do not disturb typing
  if(!fresh && curScreen() === 'map' && root.querySelector('#amap')) return;   // the map redraws itself
  syncLive();
  if(st.date && app.lastDate !== st.date){ app.cal = st.date.slice(0, 7); app.lastDate = st.date; }   // the calendar follows the Dashboard's date
  const y = window.scrollY;
  root.innerHTML = SCREENS[curScreen()]();
  window.scrollTo(0, fresh ? 0 : y);
  if(curScreen() === 'map') requestAnimationFrame(drawMap);
  app.lastW = root.clientWidth;
  drawPhoneMoons();
}
function updateDash(){   // while dragging across the graph: update in place so the touch keeps its target
  const body = document.querySelector('#app [data-sec="dash"] .a-secb');
  if(!body || body.hidden) return renderApp();
  const tmp = document.createElement('div'); tmp.innerHTML = dashBody();
  const g = body.querySelector('#agraph'), ng = tmp.querySelector('#agraph');
  if(!g || !ng) return renderApp();
  g.querySelector('svg').replaceWith(ng.querySelector('svg'));
  g.querySelector('.a-scrub').replaceWith(ng.querySelector('.a-scrub'));
  const now = g.querySelector('.a-now'), nnow = ng.querySelector('.a-now');

}

// ---------- events ----------
function initEvents(){
  const root = $('app');
  const scrubTo = x => { const r = app.drag; const f = clamp((x - r.left) / r.width, 0, 1);
    const t = new Date(app.ev.t0.getTime() + f * (app.ev.t1 - app.ev.t0)); st.minute = Math.min(1439, localMinutes(t, st.loc.tz));
    if(S.localDateStr(t, st.loc.tz) !== st.date) st.minute = f > .5 ? 1439 : 0;
    st.live = false; updateDash(); };
  const queueDraw = () => { cancelAnimationFrame(app.raf); app.raf = requestAnimationFrame(drawMap); };
  const changeDay = n => { st.live = false; st.date = S.addDays(st.date, n); renderApp(); };

  root.addEventListener('pointerdown', e => {
    app.lastTouch = Date.now();

      app.pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
      try{ mb.setPointerCapture(e.pointerId); }catch(_){}
      if(app.pointers.size === 1){ app.pan = { id:e.pointerId, x:e.clientX, y:e.clientY }; app.pinch = null; mb.style.cursor = 'grabbing'; }
      else if(app.pointers.size === 2){ const [p, q] = [...app.pointers.values()]; app.pan = null; app.pinch = { d:Math.hypot(p.x - q.x, p.y - q.y) || 1, span:app.map.span }; }
      return;
    }
    const g = e.target.closest('#agraph');
    if(g && !e.target.closest('button') && app.ev){ app.drag = g.getBoundingClientRect(); try{ g.setPointerCapture(e.pointerId); }catch(_){} scrubTo(e.clientX); return; }
    if(curScreen() === 'main' && e.target.closest('[data-sec="dash"]')) app.swipe = { x:e.clientX, y:e.clientY, t:Date.now() };   // swipe for other days works on the Dashboard only
  });
  window.addEventListener('pointermove', e => {
    if(app.pointers.has(e.pointerId) && app.map){
      app.pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if(app.pinch && app.pointers.size >= 2){ const [p, q] = [...app.pointers.values()]; const d = Math.hypot(p.x - q.x, p.y - q.y);
        if(d > 0){ app.map.span = clamp(app.pinch.span * app.pinch.d / d, .08, 120); queueDraw(); } return; }
      if(app.pan && app.pan.id === e.pointerId){ const box = $('amapbox'); if(!box) return;
        const sc = box.clientHeight / app.map.span, cl = Math.max(.05, Math.cos(app.map.lat * Math.PI / 180));
        app.map.lon -= (e.clientX - app.pan.x) / (sc * cl); app.map.lat = clamp(app.map.lat + (e.clientY - app.pan.y) / sc, -84, 84);
        app.map.lon = ((app.map.lon + 540) % 360) - 180; app.pan.x = e.clientX; app.pan.y = e.clientY; queueDraw(); }
      return;
    }
    if(app.drag) scrubTo(e.clientX);
  });
  const endPointer = e => {
    if(app.pointers.has(e.pointerId)){
      app.pointers.delete(e.pointerId);
      if(app.pointers.size < 2) app.pinch = null;
      if(app.pointers.size === 1){ const [id, p] = [...app.pointers.entries()][0]; app.pan = { id, x:p.x, y:p.y }; }
      else if(app.pointers.size === 0){ app.pan = null; const mb = $('amapbox'); if(mb) mb.style.cursor = ''; }
    }
    if(app.drag){ app.drag = null; renderApp(); }
    if(app.swipe && e.type === 'pointerup'){ const dx = e.clientX - app.swipe.x, dy = e.clientY - app.swipe.y;
      if(Math.abs(dx) > 70 && Math.abs(dy) < 50 && Date.now() - app.swipe.t < 700){ app.swiped = true; changeDay(dx < 0 ? 1 : -1); setTimeout(() => { app.swiped = false; }, 50); } }
    app.swipe = null;
  };
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  root.addEventListener('wheel', e => { if(!app.map || !e.target.closest('#amapbox')) return; e.preventDefault(); app.map.span = clamp(app.map.span * (e.deltaY > 0 ? 1.25 : .8), .08, 120); queueDraw(); }, { passive:false });

  const choose = (r, fromStart) => { setLoc(locFromResult(r)); app.q = ''; app.sq = ''; toMain(); };
  root.addEventListener('click', e => {
    if(app.swiped) return;
    if(e.target.closest('a')) return;
    const b = e.target.closest('[data-act]'); if(!b) return; const act = b.dataset.act, i = +b.dataset.i;
    switch(act){
      case 'back': navBack(); break;
      case 'reload': location.reload(); break;
      case 'resetall': try{ localStorage.removeItem(STORE_KEY); }catch(e){} location.reload(); break;
      case 'settings': checkOffline(); navPush('settings'); break;
      case 'locs': app.q = ''; app.hereMsg = ''; app.edit = false; navPush('locs'); break;
      case 'map': openMap(); navPush('map'); break;
      case 'locate': locate(false); break;
      case 'here': locate(false); break;
      case 'herebtn': app.followDenied = false; locate(false, true); break;   // the button under the header
      case 'startpick': choose(app.res[i], true); break;
      case 'pick': choose(app.res[i], false); break;
      case 'choose': setLoc(app.saved[i]); toMain(); break;
      case 'save': { const L = cleanPlace(locFromResult(app.res[i])); if(L && !app.saved.some(s => s.name === L.name)) app.saved.push(L); saveState(); app.q = ''; renderApp(true); break; }
      case 'del': { const gone = app.saved[i]; app.saved.splice(i, 1); if(gone && app.set.def === gone.name) app.set.def = 'last'; saveState(); renderApp(); break; }
      case 'edit': app.edit = !app.edit; renderApp(); break;
      case 'prev': changeDay(-1); break;
      case 'next': changeDay(1); break;
