name: Update NOTAMs (ATS / fuel)

on:
  schedule:
    - cron: '7 * * * *'      # every hour at :07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch NOTAMs (FAA NOTAM Search; FAA API only if secrets are set)
        env:
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}          # optional
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}  # optional
        run: node scripts/update-notams.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notams.json
          if git diff --staged --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update NOTAMs"
          git pull --rebase
          git push
